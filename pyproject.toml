[project]
name = "openjiuwen-harness"
version = "0.1.0"
description = "Budget-aware harness for the OpenJiuwen Challenge 2026"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openjiuwen==0.1.19",
]

[tool.uv]
# The harness is executed from source (`/app/run_agent.py`), it is not a
# distributable package, so uv must not try to build/install the project.
package = false
